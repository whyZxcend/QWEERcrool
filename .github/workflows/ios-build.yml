name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Web Assets & Fix Paths
        run: |
          mkdir -p dist
          if [ -d "ios/App/App/public" ] && [ ! -f "dist/index.html" ]; then
            cp -r ios/App/App/public/* dist/ 2>/dev/null || true
          fi
          if [ ! -f "dist/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>QWERcrool</title></head><body></body></html>' > dist/index.html
          fi
          # Fix Windows backslashes for macOS SPM
          sed -i '' 's/\\/\//g' ios/App/CapApp-SPM/Package.swift 2>/dev/null || true
          # Remove unused cordova podspec folder
          rm -rf ios/capacitor-cordova-ios-plugins

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios || true
          sed -i '' 's/\\/\//g' ios/App/CapApp-SPM/Package.swift 2>/dev/null || true

      - name: Build iOS Archive (Unsigned)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package into IPA
        run: |
          cd ios/App
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qr QWERcrool.ipa Payload
          ls -lh QWERcrool.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QWERcrool-iOS
          path: ios/App/build/QWERcrool.ipa
          retention-days: 14
