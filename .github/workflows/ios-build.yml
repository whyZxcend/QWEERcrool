name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Web Assets & Fix Paths
        run: |
          mkdir -p dist
          if [ -d "ios/App/App/public" ] && [ ! -f "dist/index.html" ]; then
            cp -r ios/App/App/public/* dist/ 2>/dev/null || true
          fi
          if [ ! -f "dist/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>QWERcrool</title></head><body></body></html>' > dist/index.html
          fi
          # Fix Windows backslashes for macOS SPM
          sed -i '' 's/\\/\//g' ios/App/CapApp-SPM/Package.swift 2>/dev/null || true
          # Remove unused cordova podspec folder
          rm -rf ios/capacitor-cordova-ios-plugins

      - name: Create Shared Scheme
        run: |
          mkdir -p ios/App/App.xcodeproj/xcshareddata/xcschemes
          cat << 'EOF' > ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1500" version="1.7">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                  <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="504EC3031FED79650016851F" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj" />
                </BuildActionEntry>
              </BuildActionEntries>
            </BuildAction>
          </Scheme>
          EOF

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package into IPA
        run: |
          cd ios/App
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr QWERcrool.ipa Payload
          ls -lh QWERcrool.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QWERcrool-iOS
          path: ios/App/build/QWERcrool.ipa
          retention-days: 14
