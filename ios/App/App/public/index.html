<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resize-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#08080f" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="QWERcrool" />
    <title>QWERcrool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/preloader.css" />
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('tg_chat_settings');
          let accentColor = '#7c5bf5';
          let hasCustomCursor = true;
          
          if (saved) {
            const settings = JSON.parse(saved);
            const themeColors = {
              'cosmic': '#7c5bf5',
              'telegram': '#2481cc',
              'forest': '#10b981',
              'sakura': '#f472b6',
              'amber': '#f59e0b',
              'light-retro': '#3390ec'
            };
            accentColor = themeColors[settings.themeId] || '#7c5bf5';
            if (settings.customCursor === false) {
              hasCustomCursor = false;
            }
          }
          
          document.documentElement.style.setProperty('--accent', accentColor);
          document.documentElement.style.setProperty('--bg', '#08080f');
          if (hasCustomCursor) {
            document.documentElement.classList.add('custom-cursor');
          } else {
            document.documentElement.classList.remove('custom-cursor');
          }
        } catch(e) {
          console.error('Theme init error:', e);
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-DElNLu6z.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-ClfKtTjF.css">
  </head>
  
  <body>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-follower" id="cursor-follower"></div>
    <div class="cursor-dot" id="cursor-dot"></div>

    <div class="preloader" id="preloader">
      <canvas id="matrix-canvas"></canvas>
      <div class="preloader-content" id="preloader-content">
        <div style="text-align: center; z-index: 10;">
          <div class="loader-text" id="loader-text"></div>
          <div class="loader-bar">
            <div class="loader-progress" id="loader-progress"></div>
          </div>
          <div class="welcome-text" id="welcome-text">Добро пожаловать!</div>
        </div>
      </div>
      <button class="gyro-permission" id="gyro-permission">
        🎮 Включить 3D эффект
      </button>
    </div>

    <div id="root"></div>
    
    <script>
      function getCurrentAccentColor() {
        try {
          const saved = localStorage.getItem('tg_chat_settings');
          if (saved) {
            const settings = JSON.parse(saved);
            const themeColors = {
              'cosmic': '#7c5bf5',
              'telegram': '#2481cc',
              'forest': '#10b981',
              'sakura': '#f472b6',
              'amber': '#f59e0b',
              'light-retro': '#3390ec'
            };
            return themeColors[settings.themeId] || '#7c5bf5';
          }
        } catch (e) {
          console.error('Failed to get theme', e);
        }
        return '#7c5bf5';
      }

      const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
      let currentAccent = getCurrentAccentColor();

      function createParticle(x, y) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        document.body.appendChild(particle);
        
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 80 + 40;
        const duration = Math.random() * 800 + 400;
        
        particle.animate([
          { transform: 'translate(0, 0) scale(1)', opacity: 0.8 },
          { transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0)`, opacity: 0 }
        ], {
          duration: duration,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
        }).onfinish = () => particle.remove();
      }

      if (!isTouchDevice) {
        const cursor = document.getElementById('cursor');
        const cursorFollower = document.getElementById('cursor-follower');
        const cursorDot = document.getElementById('cursor-dot');
        
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;
        let followerX = 0, followerY = 0;

        document.addEventListener('mousemove', (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          cursorDot.style.left = mouseX + 'px';
          cursorDot.style.top = mouseY + 'px';
          if (Math.random() > 0.92) createParticle(mouseX, mouseY);
        });

        document.addEventListener('mousedown', () => {
          cursor.style.transform = 'scale(0.7)';
          cursorFollower.style.transform = 'scale(0.7)';
        });

        document.addEventListener('mouseup', () => {
          cursor.style.transform = 'scale(1)';
          cursorFollower.style.transform = 'scale(1)';
        });

        function animateCursor() {
          cursorX += (mouseX - cursorX) * 0.18;
          cursorY += (mouseY - cursorY) * 0.18;
          followerX += (mouseX - followerX) * 0.08;
          followerY += (mouseY - followerY) * 0.08;
          cursor.style.left = cursorX - 10 + 'px';
          cursor.style.top = cursorY - 10 + 'px';
          cursorFollower.style.left = followerX - 20 + 'px';
          cursorFollower.style.top = followerY - 20 + 'px';
          window.cursorAnimation = requestAnimationFrame(animateCursor);
        }
        animateCursor();

        document.addEventListener('click', (e) => {
          for (let i = 0; i < 8; i++) {
            setTimeout(() => createParticle(e.clientX, e.clientY), i * 40);
          }
        });
      }
  // === БЛОКИРОВКА ПРАВОЙ КНОПКИ МЫШИ ===
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }, true);

  // === БЛОКИРОВКА ГОРЯЧИХ КЛАВИШ ===
  document.addEventListener('keydown', (e) => {

    // Ctrl+S (Save Page)
    if (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
    

    // Ctrl+P (Print)
    if (e.ctrlKey && (e.key === 'p' || e.key === 'P' || e.keyCode === 80)) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, true);



  // === БЛОКИРОВКА CTRL+I ===
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && (e.key === 'i' || e.key === 'I' || e.keyCode === 73)) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, true);
          
      


      // ===== 3D НАКЛОН =====
      const preloader = document.getElementById('preloader');
      const preloaderContent = document.getElementById('preloader-content');
      
      if (!isTouchDevice) {
        document.addEventListener('mousemove', (e) => {
          const centerX = window.innerWidth / 2;
          const centerY = window.innerHeight / 2;
          const rotateY = ((e.clientX - centerX) / centerX) * 15;
          const rotateX = -((e.clientY - centerY) / centerY) * 15;
          preloaderContent.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
      }
      
      let gyroEnabled = false;
      
      if (window.DeviceOrientationEvent) {
        const gyroBtn = document.getElementById('gyro-permission');
        
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          gyroBtn.classList.add('show');
          
          gyroBtn.addEventListener('click', async () => {
            try {
              const permission = await DeviceOrientationEvent.requestPermission();
              if (permission === 'granted') {
                gyroEnabled = true;
                gyroBtn.classList.remove('show');
                initGyroscope();
              }
            } catch (e) {
              console.error('Gyro permission error:', e);
            }
          });
        } else {
          gyroEnabled = true;
          initGyroscope();
        }
      }
      
      function initGyroscope() {
        window.addEventListener('deviceorientation', (e) => {
          const gamma = e.gamma || 0;
          const beta = e.beta || 0;
          const rotateY = Math.max(-30, Math.min(30, gamma));
          const rotateX = Math.max(-30, Math.min(30, beta - 45));
          preloaderContent.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
      }

      const text = 'QWERcrool';
      const loaderText = document.getElementById('loader-text');
      let charIndex = 0;
      function typeText() {
        if (charIndex < text.length) {
          loaderText.textContent += text[charIndex];
          charIndex++;
          setTimeout(typeText, 60);
        }
      }
      setTimeout(typeText, 300);

      const canvas = document.getElementById('matrix-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      const chars = 'QWERcrool0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const fontSize = 14;
      const columns = Math.floor(canvas.width / fontSize);
      const drops = Array(columns).fill().map(() => Math.random() * -100);

      function drawMatrix() {
        ctx.fillStyle = 'rgba(8, 8, 15, 0.04)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent') || currentAccent;
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
          ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        }
        window.matrixAnimation = requestAnimationFrame(drawMatrix);
      }
      drawMatrix();

      const progress = document.getElementById('loader-progress');
      const welcomeText = document.getElementById('welcome-text');
      
      let progressWidth = 0;
      let welcomeShown = false;

      const progressInterval = setInterval(() => {
        let increment = Math.random() * 25;
        if (progressWidth > 70) increment = Math.random() * 8;
        if (progressWidth > 90) increment = Math.random() * 3;

        progressWidth += increment;
        
        if (progressWidth > 100) progressWidth = 100;
        progress.style.width = progressWidth + '%';

        if (progressWidth >= 80 && !welcomeShown) {
          welcomeShown = true;
          welcomeText.classList.add('visible');
        }

        if (progressWidth === 100) {
          clearInterval(progressInterval);
          setTimeout(() => {
            preloader.classList.add('hidden');
            setTimeout(() => {
              if (preloader.parentNode) {
                preloader.parentNode.removeChild(preloader);
              }
              if (window.matrixAnimation) {
                cancelAnimationFrame(window.matrixAnimation);
              }
              if (window.cursorAnimation) {
                cancelAnimationFrame(window.cursorAnimation);
              }
            }, 600);
          }, 400);
        }
      }, 80);


      // === KEYBOARD HANDLING ===
      if (window.visualViewport) {
        var initialLayoutH = Math.min(
          document.documentElement.clientHeight || window.innerHeight,
          window.innerHeight
        );
        
        var handleVpResize = function() {
          var vp = window.visualViewport;
          var vh = vp.height;
          var offsetTop = vp.offsetTop || 0;
          
          var referenceH = initialLayoutH;
          var keyboardOpen = vh < referenceH - 50;
          
          var root = document.getElementById('root');
          var chatContainer = document.querySelector('.mobile-chat-container');
          
          if (keyboardOpen) {
            document.documentElement.style.setProperty('--vkb-viewport-height', vh + 'px');
            
            if (root) {
              root.style.setProperty('position', 'fixed', 'important');
              root.style.setProperty('top', offsetTop + 'px', 'important');
              root.style.setProperty('left', '0', 'important');
              root.style.setProperty('right', '0', 'important');
              root.style.setProperty('width', '100%', 'important');
              root.style.setProperty('height', vh + 'px', 'important');
              root.style.setProperty('max-height', vh + 'px', 'important');
              root.style.setProperty('bottom', 'auto', 'important');
              root.style.setProperty('overflow', 'hidden', 'important');
            }
            if (chatContainer) {
              chatContainer.style.setProperty('height', '100%', 'important');
              chatContainer.style.setProperty('min-height', '0', 'important');
            }
          } else {
            document.documentElement.style.setProperty('--vkb-viewport-height', '100dvh');
            if (root) {
              root.style.removeProperty('position');
              root.style.removeProperty('top');
              root.style.removeProperty('left');
              root.style.removeProperty('right');
              root.style.removeProperty('width');
              root.style.removeProperty('height');
              root.style.removeProperty('max-height');
              root.style.removeProperty('bottom');
            }
            if (chatContainer) {
              chatContainer.style.removeProperty('height');
              chatContainer.style.removeProperty('min-height');
            }
          }
        };
        
        window.visualViewport.addEventListener('resize', handleVpResize);
        window.visualViewport.addEventListener('scroll', handleVpResize);
      }

      // === ЗАПРЕТ ЗУМА НА МОБИЛЬНЫХ ===
      document.addEventListener('gesturestart', (e) => e.preventDefault());
      document.addEventListener('gesturechange', (e) => e.preventDefault());
      document.addEventListener('gestureend', (e) => e.preventDefault());

      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      let lastTouchDistance = 0;
      document.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) {
          e.preventDefault();
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
        }
      }, { passive: false });

      document.addEventListener('touchmove', (e) => {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      window.addEventListener('storage', (e) => {
        if (e.key === 'tg_chat_settings') {
          const newAccent = getCurrentAccentColor();
          currentAccent = newAccent;
          document.documentElement.style.setProperty('--accent', newAccent);
          
          try {
            const saved = localStorage.getItem('tg_chat_settings');
            if (saved) {
              const settings = JSON.parse(saved);
              if (settings.customCursor !== false) {
                document.documentElement.classList.add('custom-cursor');
              } else {
                document.documentElement.classList.remove('custom-cursor');
              }
            }
          } catch (err) {
            console.error('Failed to parse settings on storage update', err);
          }
        }
      });
    </script>
  </body>
</html>
